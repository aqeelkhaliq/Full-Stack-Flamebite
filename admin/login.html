<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlameBite | Admin Login</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/admin.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>
<body>

    <section class="admin-login">
        <div class="login-box">
            <div class="login-header">
                <img src="../assets/images/logo.png" alt="FlameBite" width="60" />
                <h2>Admin Login</h2>
                <p>Enter your credentials to access the dashboard</p>
            </div>
            <form id="adminLoginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="adminEmail" placeholder="admin@flamebite.com" required />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="adminPassword" placeholder="Enter password" required />
                </div>
                <button type="submit" class="login-btn">Login</button>
            </form>
            <p class="back-link"><a href="../pages/index.html">← Back to Website</a></p>
        </div>
    </section>

    <div id="toast">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toast-message">Item Added</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/api.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin-login.js"></script>
</body>
</html>
